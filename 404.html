<script>
(function () {
  var path = location.pathname || "/";
  try { sessionStorage.setItem("spa_redirect", path + (location.search||"") + (location.hash||"")); } catch (e) {}
  var seg = path.replace(/^\/+|\/+$/g, "").split("/")[0].toLowerCase();
  var map = { spin: "spin", topup: "topup", cekakun: "cekakun", download: "download" };
  var go = map[seg] || "";
  location.replace(go ? ("/?go=" + encodeURIComponent(go)) : "/");
})();
</script>
