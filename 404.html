<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFKIPAS</title>
<script>
(function () {
  var path = location.pathname || "/";
  var search = location.search || "";
  var hash = location.hash || "";
  try {
    sessionStorage.setItem("spa_redirect", path + search + hash);
  } catch (e) {}
  // Ambil segmen pertama: /spin/xxx -> spin
  var seg = path.replace(/^\/+|\/+$/g, "").split("/")[0].toLowerCase();
  var map = {
    spin: "spin", event: "spin",
    topup: "topup",
    cekakun: "cekakun", cek: "cekakun",
    download: "download",
    history: "history", riwayat: "history",
    faq: "faq", home: "home"
  };
  var go = map[seg] || "";
  if (go) {
    location.replace("/?go=" + encodeURIComponent(go));
  } else {
    location.replace("/");
  }
})();
</script>
</head>

</body>
</html>
